# Arquitetura Zero Trust: por padrão, nenhum tráfego é permitido.
# Cada regra abaixo abre exatamente o caminho necessário.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sigil-default-deny
  namespace: sigil
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sigil-backend-allow
  namespace: sigil
spec:
  podSelector:
    matchLabels:
      app: sigil-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sigil-gateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: neo4j
      ports:
        - protocol: TCP
          port: 7687
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    - to: []
      ports:
        - protocol: UDP
          port: 53  # DNS
