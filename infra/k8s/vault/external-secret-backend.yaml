# ExternalSecret que sincroniza os segredos do backend SIGIL a partir do
# Vault para um Secret nativo do Kubernetes, consumido pelo Deployment
# em infra/k8s/backend-deployment.yaml (envFrom: secretRef).
#
# Pre-requisito: popular o Vault antes de aplicar este manifesto:
#   vault kv put secret/sigil/backend \
#     SECRET_KEY="..." POSTGRES_PASSWORD="..." NEO4J_PASSWORD="..." MINIO_SECRET_KEY="..."
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sigil-backend-external-secret
  namespace: sigil
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: sigil-vault-backend
    kind: SecretStore
  target:
    name: sigil-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: sigil/backend
        property: SECRET_KEY
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: sigil/backend
        property: POSTGRES_PASSWORD
    - secretKey: NEO4J_PASSWORD
      remoteRef:
        key: sigil/backend
        property: NEO4J_PASSWORD
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: sigil/backend
        property: MINIO_SECRET_KEY
