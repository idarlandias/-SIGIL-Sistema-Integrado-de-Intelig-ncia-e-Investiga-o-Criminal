# Instala o External Secrets Operator (ESO) via manifesto de referencia.
# Em producao, prefira instalar via Helm:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#
# Este arquivo documenta apenas o SecretStore que conecta o ESO ao Vault
# do SIGIL - o operador em si deve ser instalado separadamente.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sigil-vault-backend
  namespace: sigil
spec:
  provider:
    vault:
      server: "http://vault.sigil.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
---
# Secret bootstrap contendo o token do Vault (root/dev apenas).
# Em producao: substituir por autenticacao Kubernetes (auth/kubernetes)
# usando ServiceAccount + Role, nunca token estatico versionado.
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: sigil
type: Opaque
stringData:
  token: "changeme-substituir-por-token-real-do-vault"
