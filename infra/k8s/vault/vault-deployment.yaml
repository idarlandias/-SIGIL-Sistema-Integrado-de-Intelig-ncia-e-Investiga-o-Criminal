# HashiCorp Vault em modo dev/standalone para o cluster SIGIL.
# Em produção real, usar Vault em modo HA com backend de armazenamento
# durável (Consul, Raft integrado) e processo formal de unseal — este
# manifesto cobre o essencial para integração com o backend da aplicação.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: sigil
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          ports:
            - containerPort: 8200
          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:8200
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: sigil
spec:
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
  type: ClusterIP
